pe":"reference"},{"source":"sec-rRDDwm1LZy_CFk7nC2L0k","target":"sub-6dUUtiFofAXIXmUIpGmeF","type":"reference"},{"source":"sec-rRDDwm1LZy_CFk7nC2L0k","target":"sub-U84ZnWVaCvrh4Ir1xroli","type":"reference"},{"source":"sec-syYS1lzON5CBCL1ZdsBul","target":"sub-xYOy8xUJpcssgjNVmANNW","type":"reference"},{"source":"sec-syYS1lzON5CBCL1ZdsBul","target":"sec-PAskKN4i1etyZhtOY5xtv","type":"reference"},{"source":"sec-syYS1lzON5CBCL1ZdsBul","target":"sub-CyAf_GsK2z3HhpvlCgKlD","type":"reference"},{"source":"sec-syYS1lzON5CBCL1ZdsBul","target":"sec-TmlplXlhpu2gAP4_iKrgd","type":"reference"},{"source":"sec-syYS1lzON5CBCL1ZdsBul","target":"sec-dIOSpm6loMFLin3AzkYRN","type":"reference"},{"source":"sec-taGb2W-Ks5lKWB8hcj3UY","target":"sec-taGb2W-Ks5lKWB8hcj3UY","type":"reference"},{"source":"sec-taGb2W-Ks5lKWB8hcj3UY","target":"sub-xYOy8xUJpcssgjNVmANNW","type":"reference"},{"source":"sec-taGb2W-Ks5lKWB8hcj3UY","target":"sec-FKg-HIOFmN1Oiyr_KJhnT","type":"reference"},{"source":"sec-taGb2W-Ks5lKWB8hcj3UY","target":"sec-A6gecSxlJYGPIDKvgzjsG","type":"reference"},{"source":"sec-taGb2W-Ks5lKWB8hcj3UY","target":"sub-sec-FKg-HIOFmN1Oiyr_KJhnT-5","type":"reference"},{"source":"sec-x6eVbGvoVfS9GNeqNkLUG","target":"sec-x6eVbGvoVfS9GNeqNkLUG","type":"reference"},{"source":"sec-xEbsOCjQmAy1Uj_H6qRLr","target":"sec-xEbsOCjQmAy1Uj_H6qRLr","type":"reference"},{"source":"sec-z3nlCPJ5B1h7TUhEf25LL","target":"sec-z3nlCPJ5B1h7TUhEf25LL","type":"reference"}]};
      const container = document.getElementById("app");
      const label = document.getElementById("label");

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf7f5f2);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 4000);
      camera.position.set(0, 260, 650);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 120;
      controls.maxDistance = 1600;

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.1);
      scene.add(light);

      const colorMap = {
        part: 0x3f6fd3,
        section: 0x2c2a27,
        subsection: 0xb86b00,
        reference: 0x7b5ea7,
      };

      const nodeMeshes = new Map();
      data.nodes.forEach((node) => {
        const geometry = new THREE.SphereGeometry(node.type === "part" ? 8 : node.type === "section" ? 6 : 4, 16, 16);
        const material = new THREE.MeshStandardMaterial({ color: colorMap[node.type] || 0x888888 });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(node.x, node.y, node.z);
        mesh.userData = node;
        scene.add(mesh);
        nodeMeshes.set(node.id, mesh);
      });

      const hierarchyMaterial = new THREE.LineBasicMaterial({ color: 0xb1a79a });
      const referenceMaterial = new THREE.LineDashedMaterial({ color: 0x7b5ea7, dashSize: 8, gapSize: 6 });

      data.edges.forEach((edge) => {
        const source = nodeMeshes.get(edge.source);
        const target = nodeMeshes.get(edge.target);
        if (!source || !target) return;
        const points = [source.position, target.position];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = edge.type === "reference" ? referenceMaterial : hierarchyMaterial;
        const line = new THREE.Line(geometry, material);
        if (edge.type === "reference") {
          line.computeLineDistances();
        }
        scene.add(line);
      });

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let hovered = null;

      function onPointerMove(event) {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const intersects = raycaster.intersectObjects(Array.from(nodeMeshes.values()));
        if (intersects.length > 0) {
          const hit = intersects[0].object;
          if (hovered !== hit) {
            hovered = hit;
            label.textContent = hit.userData.label || hit.userData.id;
          }
        } else if (hovered) {
          hovered = null;
          label.textContent = "Hover nodes to inspect";
        }
      }

      window.addEventListener("pointermove", onPointerMove);

      document.getElementById("reset").addEventListener("click", () => {
        controls.reset();
        camera.position.set(0, 260, 650);
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    </script>
